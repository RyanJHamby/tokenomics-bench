[project]
name = "tokbench"
version = "0.0.1"
description = "Cost and energy per token of LLM serving under a p99 SLO"
license = {text = "MIT"}
authors = [{name = "Ryan Hamby"}]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "matplotlib"]
plots = ["matplotlib"]
gpu = ["nvidia-ml-py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
