# B3: FP16 vs FP8 vs AWQ-INT4. Report GSM8K accuracy delta (tokbench.quality.gsm8k_accuracy)
# next to every throughput claim. FP8 needs Ada/Hopper (L40S/H100); AWQ checkpoint is a
# third-party quantization, so it is a model change as well as a precision change (noted in README).
name: b3_quantization
block: B3
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
repeats: 3
warmup: 20
startup_seconds: 240
n_requests: 200
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
variants:
- name: fp16
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching]
- name: fp8
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching, --quantization, fp8]
- name: awq-int4
  model: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching, --quantization, awq_marlin]
loads:
- {mode: open, qps: 2}
- {mode: open, qps: 8}
- {mode: open, qps: 16}
- {mode: open, qps: 24}
