# B1 / PILOT. Measures, for the baseline FP16 server: SLO capacity (doubling+bisection, 8% resolution),
# batch-1 decode speed (c=1), saturated throughput and uncapped power draw (c=64), and launch-to-launch
# variance over 3 independent launches. Variance sizes every later block (tokbench.analysis.required_repeats);
# saturated p95 power sets the power-cap arms (tokbench.arms). Prefix caching is OFF everywhere except its own
# block, so cache state cannot confound other comparisons. Everything here is also data (B1 results).
name: b1_capacity_pilot
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
startup_seconds: 240
soak_s: 60
idle_s: 10
slo: {ttft_s: 1.0, tpot_s: 0.05}
capacity_file: results/capacity/capacity.json
block: B1
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
repeats: 3
warmup_s: 30
measure_s: 60
variants:
- name: fp16-default
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --no-enable-prefix-caching]
loads:
- {mode: capacity_search, qps_lo: 1, qps_hi: 32, resolution: 0.08}
- {mode: closed, concurrency: 1}
- {mode: closed, concurrency: 64}
