# B2 TEMPLATE (core finding): power cap (-pl) vs SM clock lock (-lgc) vs baseline, FP16. Do not run directly:
# `python -m tokbench.arms <pilot dir> --template configs/b2_power_clock.template.yaml > configs/b2_power_clock.yaml`
# fills the arms from the pilot's measured saturated power and the card's limits (pre-registered rule).
# Loads: saturation (c=64) and 70% of the BASELINE capacity (equal absolute offered load for every arm), so
# J/token is compared at the same work. Primary question: does the energy-optimal clock differ from the
# $/Mtok-optimal one, and does a cap ever bind during decode?
name: b2_power_clock.template
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
startup_seconds: 240
soak_s: 60
idle_s: 10
slo: {ttft_s: 1.0, tpot_s: 0.05}
capacity_file: results/capacity/capacity.json
block: B2
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
repeats: 3
warmup_s: 30
measure_s: 180
variants:
- name: uncapped
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --no-enable-prefix-caching]
loads:
- {mode: closed, concurrency: 64}
- {mode: open, rel: 0.7, ref: fp16-default}
