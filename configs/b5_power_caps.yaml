# B5: GPU power cap sweep (nvidia-smi -pl, root required) on the FP8 config. Caps are
# 100/85/70/55% of an assumed 350 W limit (L40S). If the rented GPU differs, rescale before running.
# Hypothesis H5: moderate cap cuts J/token with a smaller throughput loss on decode-bound load.
name: b5_power_caps
block: B5
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
repeats: 3
warmup: 20
startup_seconds: 240
n_requests: 200
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
variants:
- name: fp8-cap350w
  power_cap_w: 350
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching, --quantization, fp8]
- name: fp8-cap300w
  power_cap_w: 300
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching, --quantization, fp8]
- name: fp8-cap245w
  power_cap_w: 245
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching, --quantization, fp8]
- name: fp8-cap190w
  power_cap_w: 190
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching, --quantization, fp8]
loads:
- {mode: open, qps: 4}
- {mode: open, qps: 12}
- {mode: open, qps: 24}
