# B4: CUDA graphs on vs --enforce-eager. Hypothesis H4: TPOT gap is largest at low batch
# (closed-loop c=1,4), shrinking as batch grows. Closed loop here to pin batch size.
name: b4_cuda_graphs
block: B4
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
repeats: 3
warmup: 20
startup_seconds: 240
n_requests: 120
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
variants:
- name: cudagraphs-on
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching]
- name: eager
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching, --enforce-eager]
loads:
- {mode: closed, concurrency: 1}
- {mode: closed, concurrency: 4}
- {mode: closed, concurrency: 16}
- {mode: closed, concurrency: 64}
