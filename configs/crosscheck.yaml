# Cross-check of tokbench's load generator vs `vllm bench serve` on the same running server.
# Run via scripts/crosscheck.sh (attaches to a server it starts). Not a result block.
name: crosscheck
block: XCHECK
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
slo: {ttft_s: 1.0, tpot_s: 0.05}
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
variants:
  - {name: fp16-default, server_args: [--max-model-len, "4096", --gpu-memory-utilization, "0.90", --no-enable-prefix-caching]}
loads:
  - {mode: open, qps: 4}
repeats: 1
warmup_s: 20
measure_s: 120
startup_seconds: 240
