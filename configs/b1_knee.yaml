# B1: where is the latency knee? One variant, wide load sweep. Capacity from this block
# feeds B7 (overload) via tokbench.overload. Open loop is primary for latency claims.
name: b1_knee
block: B1
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
repeats: 3
warmup: 20
startup_seconds: 240
n_requests: 200
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
variants:
  - {name: fp16-default, server_args: [--max-model-len, "4096", --gpu-memory-utilization, "0.90", --enable-prefix-caching]}
loads:
  - {mode: closed, concurrency: 1}
  - {mode: closed, concurrency: 4}
  - {mode: closed, concurrency: 16}
  - {mode: closed, concurrency: 64}
  - {mode: open, qps: 1}
  - {mode: open, qps: 2}
  - {mode: open, qps: 4}
  - {mode: open, qps: 8}
  - {mode: open, qps: 12}
  - {mode: open, qps: 16}
  - {mode: open, qps: 24}
  - {mode: open, qps: 32}
