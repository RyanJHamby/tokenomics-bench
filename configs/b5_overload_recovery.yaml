# B5 (EXPLORATORY; 'reliable' in the thesis): baseline FP16 driven past capacity then dropped back.
# Phase 1: 1.3 x capacity for 60 s (queue builds, goodput collapses?); phase 2: 0.5 x capacity for 120 s.
# Reported: per-phase goodput/SLO attainment, preemptions, and recovery time (first 5 s arrival window
# whose p99 TTFT is back within the SLO with zero failures). No confirmatory claim.
name: b5_overload_recovery
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
startup_seconds: 240
soak_s: 60
idle_s: 10
slo: {ttft_s: 1.0, tpot_s: 0.05}
capacity_file: results/capacity/capacity.json
block: B5
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
repeats: 3
warmup_s: 0
measure_s: 1
drain_s: 60
variants:
- name: fp16-default
  model: meta-llama/Llama-3.1-8B-Instruct
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --dtype, float16, --generation-config, vllm, --max-num-seqs, '256', --max-num-batched-tokens,
    '2048', --seed, '0', --async-scheduling, --enable-chunked-prefill, --no-enable-prefix-caching, --attention-backend, FLASH_ATTN, --revision, 0e9e39f249a16976918f6564b8830bc894c89659,
    --tokenizer-revision, 0e9e39f249a16976918f6564b8830bc894c89659]
loads:
- mode: phased_open
  phases:
  - {rel: 1.3, ref: fp16-default, duration_s: 60}
  - {rel: 0.5, ref: fp16-default, duration_s: 120}
