# Synthetic demo against the mock server. Numbers from this config are NOT results.
name: demo_synthetic
block: DEMO
model: mock
seed: 0
workload: {input_tokens: 64, output_tokens: 24, prefix_share: 0.0}
slo: {ttft_s: 0.5, tpot_s: 0.1}
variants:
  - {name: baseline, server_args: [--tpot, "0.012", --slots, "8"], slots: 8}
  - {name: faster, server_args: [--tpot, "0.008", --slots, "8"], slots: 8}
  - {name: faster-cap, server_args: [--tpot, "0.009", --slots, "8"], slots: 8, power_cap_w: 200}
  - {name: faster-lock, server_args: [--tpot, "0.010", --slots, "8"], slots: 8, clock_lock_mhz: 1500}
loads:
  - {mode: open, qps: 4}
  - {mode: open, qps: 12}
  - {mode: open, qps: 24}
  - {mode: closed, concurrency: 8}
repeats: 2
warmup_s: 1
measure_s: 5
drain_s: 5
startup_seconds: 5
idle_s: 1
