# B2: prefix caching on/off at 0/50/90% shared-prefix share. Gate: greedy outputs
# identical on/off (tokbench.quality.greedy_equivalence) before timing is trusted.
# Hypothesis H2: p50 TTFT drops materially only at high share.
name: b2_prefix_cache
block: B2
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
repeats: 3
warmup: 20
startup_seconds: 240
n_requests: 200
workload: {input_tokens: 1024, output_tokens: 64, prefix_share: 0.0}
variants:
- name: prefix-on-s0
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching]
  workload: {input_tokens: 1024, output_tokens: 64, prefix_share: 0.0}
- name: prefix-off-s0
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --no-enable-prefix-caching]
  workload: {input_tokens: 1024, output_tokens: 64, prefix_share: 0.0}
- name: prefix-on-s50
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching]
  workload: {input_tokens: 1024, output_tokens: 64, prefix_share: 0.5}
- name: prefix-off-s50
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --no-enable-prefix-caching]
  workload: {input_tokens: 1024, output_tokens: 64, prefix_share: 0.5}
- name: prefix-on-s90
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching]
  workload: {input_tokens: 1024, output_tokens: 64, prefix_share: 0.9}
- name: prefix-off-s90
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --no-enable-prefix-caching]
  workload: {input_tokens: 1024, output_tokens: 64, prefix_share: 0.9}
loads:
- {mode: open, qps: 2}
- {mode: open, qps: 8}
- {mode: open, qps: 16}
