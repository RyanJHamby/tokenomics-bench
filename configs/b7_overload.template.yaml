# B7 TEMPLATE: loads are overwritten by `python -m tokbench.overload` using measured B1
# SLO capacity x {1.2,1.5,2.0}. Do not hand-edit qps; it is pre-registered as a capacity multiple.
name: b7_overload.template
block: B7
model: meta-llama/Llama-3.1-8B-Instruct
seed: 0
repeats: 3
warmup: 20
startup_seconds: 240
n_requests: 300
workload: {input_tokens: 512, output_tokens: 128, prefix_share: 0.0}
variants:
- name: fp16-default
  server_args: [--max-model-len, '4096', --gpu-memory-utilization, '0.90', --enable-prefix-caching]
loads:
- {mode: open, qps: 1}
